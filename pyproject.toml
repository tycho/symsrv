[project]
name = "symsrv"
version = "1.0.0"
description = "Python symbol server caching proxy"
authors = [
	{ name = "Steven Noonan", email = "steven@uplinklabs.net" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"aiofiles (>=25.1.0,<26.0.0)",
	"aiohttp[speedups]>=3.14.3,<4.0.0",
	"aiosqlite>=0.22.1,<1.0.0",
	"anyio (>=4.14.2,<5.0.0)",
	"certifi (>=2026.7.22,<2027.0.0)",
	"fastapi (>=0.141.1,<1.0.0)",
	"httptools (>=0.8.0,<1.0.0)",
	"pyyaml (>=6.0.3,<7.0.0)",
	"starlette (>=1.6.0,<2.0.0)",
	"tomlkit (>=0.15.1,<1.0.0)",
	"uvicorn (>=0.52.4,<1.0.0)",
	"websockets (>=17.0.1,<18.0.0)",
]

[project.optional-dependencies]
profiling = [
	"pyinstrument (>=5.1.3,<6.0.0)",
]

[project.scripts]
serve = "symsrv:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pyinstrument>=5.1.3",
    "pylint>=4.0.7",
    "types-aiofiles>=25.1.0.20260518",
    "types-pyyaml>=6.0.12.20260815",
    "types-ujson>=5.10.0.20250822",
    "viztracer>=1.1.1",
]

[tool.mypy]
install_types = true
non_interactive = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = ['.venv']
